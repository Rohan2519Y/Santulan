# Serves the CRA build with client-side routing (React Router) - any unknown path falls back to index.html instead
# of a 404, since the router itself decides what that path means.
# Security headers (audit gap G-45) are set at the server level so they apply to every response, including the 404 fallback and static files.
# The CSP allows the Google Fonts the pages use and the API origin the build was given; adjust connect-src to your real API origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # no-referrer: the password-reset link carries a token in its query string; it must never leak in a Referer header.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable once the site is served over HTTPS (it is ignored over plain HTTP, and must not be sent before TLS is in place):
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
