# Serves the CRA build with client-side routing (React Router) - any unknown path falls back to index.html instead
# of a 404, since the router itself decides what that path means.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
